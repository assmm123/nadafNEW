; حدود رفع فيديو السلايدر — تُقرأ من PHP-FPM و CGI دون الحاجة لجذر السيرفر.
;
; الحاجة: فيديو يصل إلى دقيقة قد يبلغ عشرات الميغابايت، وكانت الحدود
; الافتراضية (12M / 16M) ترفضه **قبل** أن يصل إلى Laravel، فلا يرى المالك
; رسالة مفهومة بل فشلًا صامتًا أو خطأ غامضًا.
;
; post_max_size أكبر من upload_max_filesize عمدًا: الطلب يحمل الملف
; مع بقية الحقول (النص، الرابط، المدة)، ولو تساويا لرُفض الطلب بسبب
; تلك الزيادة الصغيرة وحدها.
;
; ملاحظة: لا تُعدَّل هذه القيم في .htaccess عبر php_value لأنها تُسقط
; الطلب بـ500 إن كان PHP يعمل كـFPM لا كوحدة أباتشي. ولو لم يدعم
; السيرفر ملف .user.ini فإنه يتجاهله بهدوء.

upload_max_filesize = 128M
post_max_size = 136M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
max_file_uploads = 20
